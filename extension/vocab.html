<!DOCTYPE html>
<!-- vocab.html — the saved-words list. Opens when you click the extension's
     toolbar icon (manifest "action"). Plain extension page: it can use
     chrome.storage directly, same data the content script writes. -->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 380px;
      max-height: 560px;
      margin: 0;
      padding: 0;
      background: #121212;
      color: #fff;
      font-family: Roboto, Arial, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      background: #121212;
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 15px;
      font-weight: 700;
    }
    header span { color: #8f8f8f; font-weight: 400; }
    #sync { margin-left: auto; font-size: 11.5px; }
    #list { padding: 4px 16px 14px; }
    .entry {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .entry:last-child { border-bottom: none; }
    .top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .word { font-size: 16px; font-weight: 700; }
    .trans { font-size: 14px; font-weight: 600; color: #ffd54f; flex: 1; }
    .del {
      all: unset;
      cursor: pointer;
      color: #666;
      font-size: 12px;
      padding: 2px 4px;
    }
    .del:hover { color: #ff6e6e; }
    .def { margin-top: 4px; font-size: 12.5px; color: #cfcfcf; line-height: 1.4; }
    .context { margin-top: 6px; font-size: 12px; color: #9a9a9a; font-style: italic; }
    .song { margin-top: 2px; font-size: 11.5px; color: #777; }
    .empty { padding: 28px 16px; color: #8f8f8f; font-size: 13.5px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>My vocabulary <span id="count"></span> <span id="sync"></span></header>
  <div id="list"></div>
  <script src="config.js"></script>
  <script src="syncProvider.js"></script>
  <script src="vocabStore.js"></script>
  <script src="vocab.js"></script>
</body>
</html>
