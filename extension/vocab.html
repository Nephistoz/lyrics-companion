<!DOCTYPE html>
<!-- vocab.html — the saved-words list. Opens when you click the extension's
     toolbar icon (manifest "action"). Plain extension page: it can use
     chrome.storage directly, same data the content script writes.
     Colors come from CSS variables that vocab.js sets from SettingsStore,
     so it follows the same theme + accent as the lyrics panel. -->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("fonts/SpaceGrotesk.woff2") format("woff2");
      font-weight: 300 700;
    }
    :root {
      --bg: #14141b;
      --surface: #1c1c26;
      --text: #f2f0eb;
      --dim: #8b8b98;
      --line: rgba(255, 255, 255, 0.09);
      --accent: #ffb454;
    }
    body {
      width: 380px;
      max-height: 560px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      background: var(--bg);
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      font-weight: 700;
      z-index: 1;
    }
    header span { color: var(--dim); font-weight: 400; }
    #sync { margin-left: auto; font-size: 11.5px; }
    #list { padding: 4px 16px 14px; }
    .entry {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .entry:last-child { border-bottom: none; }
    .top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .word { font-size: 16px; font-weight: 700; }
    .trans { font-size: 14px; font-weight: 600; color: var(--accent); flex: 1; }
    .del {
      all: unset;
      cursor: pointer;
      color: var(--dim);
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .del:hover { color: #ff6e6e; }
    .def { margin-top: 4px; font-size: 12.5px; color: var(--text); opacity: 0.75; line-height: 1.4; }
    .context { margin-top: 6px; font-size: 12px; color: var(--dim); font-style: italic; }
    .song { margin-top: 2px; font-size: 11.5px; color: var(--dim); opacity: 0.8; }
    .empty { padding: 28px 16px; color: var(--dim); font-size: 13.5px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>My vocabulary <span id="count"></span> <span id="sync"></span></header>
  <div id="list"></div>
  <script src="config.js"></script>
  <script src="syncProvider.js"></script>
  <script src="settingsStore.js"></script>
  <script src="vocabStore.js"></script>
  <script src="vocab.js"></script>
</body>
</html>
